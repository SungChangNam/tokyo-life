<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
</head>
<body>

<h1 th:text="${post.title}">게시글 제목</h1>

<p th:text="${post.content}">게시글 내용</p>

<a href="/">목록으로 돌아가기</a>
<div th:each="image : ${images}">
    <img th:src="@{/posts/{postId}/images/{imageId}(
                postId=${post.id},
                imageId=${image.id}
            )}"
         th:alt="${image.altText != null ? image.altText : ''}"
         style="max-width: 100%; height: auto;">
</div>
</body>
</html>
