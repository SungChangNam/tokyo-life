<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tokyo Life 관리자</title>
</head>
<body>

<h1>관리자 페이지</h1>

<p>
    <span th:text="${username}">admin</span>님, 로그인했습니다.
</p>

<a th:href="@{/}">홈페이지로 이동</a>

<form th:action="@{/logout}" method="post">
    <button type="submit">로그아웃</button>
</form>
<p>
    <a th:href="@{/admin/posts/new}">게시글 작성</a>
</p>
<p th:if="${message}" th:text="${message}" role="status"></p>
<p>
    <a th:href="@{/admin/categories}">카테고리 관리</a>
</p>
<p>
    <a th:href="@{/admin/tags}">태그 관리</a>
</p>
</body>
</html>
