<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>카테고리 추가 | Tokyo Life</title>
</head>
<body>
<h1>카테고리 추가</h1>

<form th:action="@{/admin/categories}"
      th:object="${categoryForm}"
      method="post">

    <div th:if="${#fields.hasAnyErrors()}" role="alert">
        <p>입력 내용을 확인해주세요.</p>
        <ul>
            <li th:each="error : ${#fields.allErrors()}"
                th:text="${error}">
            </li>
        </ul>
    </div>

    <div>
        <label for="name">카테고리 이름</label>
        <input type="text"
               id="name"
               th:field="*{name}"
               maxlength="50"
               required>
    </div>

    <div>
        <label for="displayOrder">표시 순서</label>
        <input type="number"
               id="displayOrder"
               th:field="*{displayOrder}"
               min="0"
               max="2147483647"
               step="1"
               required>
    </div>

    <p>작은 숫자부터 표시됩니다. 같으면 카테고리 번호순입니다.</p>

    <button type="submit">등록</button>
</form>

<p>
    <a th:href="@{/admin/categories}">카테고리 목록으로</a>
</p>
</body>
</html>
