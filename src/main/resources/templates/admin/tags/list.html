<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>태그 관리 | Tokyo Life</title>
</head>
<body>
<h1>태그 관리</h1>

<p>
    <a th:href="@{/admin}">관리자 홈으로</a>
</p>

<p>
    <a th:href="@{/admin/tags/new}">태그 추가</a>
</p>

<p th:if="${message}"
   th:text="${message}"
   role="status">
</p>

<p th:if="${tagError}"
   th:text="${tagError}"
   role="alert">
</p>

<p th:if="${#lists.isEmpty(tags)}">
    등록된 태그가 없습니다.
</p>

<table th:unless="${#lists.isEmpty(tags)}">
    <thead>
    <tr>
        <th scope="col">번호</th>
        <th scope="col">이름</th>
        <th scope="col">게시글 수</th>
        <th scope="col">등록 시간</th>
        <th scope="col">수정 시간</th>
        <th scope="col">관리</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="tag : ${tags}">
        <td th:text="${tag.id}">1</td>

        <td>
            <a th:href="@{/admin/tags/{id}/edit(id=${tag.id})}"
               th:text="${tag.name}">
                라멘
            </a>
        </td>

        <td th:text="${tag.postCount}">0</td>

        <td th:text="${#temporals.format(
                tag.createdAt.atZoneSameInstant(
                    T(java.time.ZoneId).of('Asia/Tokyo')
                ),
                'yyyy-MM-dd HH:mm'
            )}">
        </td>

        <td th:text="${#temporals.format(
                tag.updatedAt.atZoneSameInstant(
                    T(java.time.ZoneId).of('Asia/Tokyo')
                ),
                'yyyy-MM-dd HH:mm'
            )}">
        </td>

        <td>
            <form th:action="@{/admin/tags/{id}/delete(id=${tag.id})}"
                  method="post"
                  onsubmit="return confirm('이 태그를 삭제하시겠습니까? 게시글의 태그 연결도 제거되며 게시글은 유지됩니다.');">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p>게시글 수에는 공개 글과 임시 저장 글이 모두 포함됩니다.</p>
<p>태그를 삭제하면 게시글과의 태그 연결도 제거됩니다. 게시글은 삭제되지 않습니다.</p>

</body>
</html>
