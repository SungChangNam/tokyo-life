spring:
  application:
    name: tokyo-life

  datasource:
    url: jdbc:postgresql://localhost:5432/tokyo_life
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

app:
  upload:
    directory: ${UPLOAD_DIR:${user.home}/tokyo-life-uploads}